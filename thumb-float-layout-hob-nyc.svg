<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 980" font-family="system-ui, Segoe UI, sans-serif">
  <style>
    .phone { fill: #0f1419; stroke: #2a3441; stroke-width: 1; }
    .header { fill: #1c2430; }
    .pill { fill: #2a3441; stroke: #3d4f63; stroke-width: 1; }
    .pill-new { fill: #1a3a4a; stroke: #3d9aad; stroke-width: 1.5; }
    .pill-dock { fill: #252b33; stroke: #3d4f63; stroke-width: 1; }
    .pill-dock-new { fill: #1a3a4a; stroke: #3d9aad; stroke-width: 1.5; }
    .label { fill: #ffffff; font-size: 10px; font-weight: 600; text-anchor: middle; }
    .label-sm { fill: #8b98a5; font-size: 9px; }
    .guide { stroke: #003da5; stroke-width: 1; stroke-dasharray: 4 3; fill: none; opacity: 0.7; }
    .title { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .subtitle { fill: #8b98a5; font-size: 10px; }
    .note { fill: #3d9aad; font-size: 9px; }
  </style>

  <text x="20" y="28" class="title">Proposed tabs: HOB / NYC Citibike + HOB&lt;-&gt;MT</text>
  <text x="20" y="46" class="subtitle">Review only ù teal = new. GBFS refresh SEPARATE per Citibike tab. Stack ~65%.</text>

  <g transform="translate(20, 60)">
    <text x="175" y="16" class="title" text-anchor="middle" font-size="12">Startup thumb float (proposed)</text>
    <rect class="phone" x="0" y="24" width="390" height="880" rx="12"/>
    <rect class="header" x="0" y="71" width="390" height="64"/>
    <text x="195" y="108" class="label" font-size="12">JC &lt;-&gt; NYC Transit</text>
    <line class="guide" x1="195" y1="135" x2="195" y2="870"/>
    <line class="guide" x1="0" y1="560" x2="390" y2="560"/>
    <text x="8" y="555" class="label-sm">stack center ~65%</text>

    <text x="85" y="300" class="label-sm" text-anchor="middle">citibike col</text>
    <rect class="pill" x="35" y="310" width="100" height="46" rx="23"/><text x="85" y="337" class="label">Cbike JC</text>
    <rect class="pill" x="35" y="366" width="100" height="46" rx="23"/><text x="85" y="393" class="label">Cbike S JC</text>
    <rect class="pill-new" x="35" y="422" width="100" height="46" rx="23"/><text x="85" y="449" class="label">Cbike HOB</text>
    <rect class="pill-new" x="35" y="478" width="100" height="46" rx="23"/><text x="85" y="505" class="label">Cbike NYC</text>

    <text x="195" y="244" class="label-sm" text-anchor="middle">transit col</text>
    <rect class="pill" x="145" y="254" width="100" height="46" rx="23"/><text x="195" y="281" class="label">From JC</text>
    <rect class="pill" x="145" y="310" width="100" height="46" rx="23"/><text x="195" y="337" class="label">To JC</text>
    <rect class="pill" x="145" y="366" width="100" height="46" rx="23"/><text x="195" y="393" class="label">HBLR PATH</text>
    <rect class="pill" x="145" y="422" width="100" height="46" rx="23"/><text x="195" y="449" class="label">Tunnels</text>
    <rect class="pill" x="145" y="478" width="100" height="46" rx="23"/><text x="195" y="505" class="label">MT to JC</text>
    <rect class="pill" x="145" y="534" width="100" height="46" rx="23"/><text x="195" y="561" class="label">NJTb</text>
    <rect class="pill-new" x="145" y="590" width="100" height="46" rx="23"/><text x="195" y="617" class="label">HOB&lt;-&gt;MT</text>

    <text x="195" y="670" class="note" text-anchor="middle">Top row: Cbike JC beside From JC</text>
    <text x="195" y="686" class="note" text-anchor="middle">Each Citibike tab refreshes its own GBFS set</text>
  </g>

  <g transform="translate(440, 60)">
    <text x="185" y="16" class="title" text-anchor="middle" font-size="12">Docked ribbon (4/row) + tab content</text>
    <rect class="phone" x="0" y="24" width="390" height="880" rx="12"/>
    <rect class="header" x="0" y="71" width="390" height="64"/>
    <text x="195" y="108" class="label" font-size="12">JC &lt;-&gt; NYC Transit</text>
    <rect fill="#1c2430" stroke="#2a3441" x="0" y="135" width="390" height="98"/>

    <rect class="pill-dock" x="6" y="141" width="91" height="28" rx="7"/><text x="51" y="159" class="label" font-size="8">Cbike JC</text>
    <rect class="pill-dock" x="101" y="141" width="91" height="28" rx="7"/><text x="146" y="159" class="label" font-size="8">Cbike S JC</text>
    <rect class="pill-dock-new" x="196" y="141" width="91" height="28" rx="7"/><text x="241" y="159" class="label" font-size="8">Cbike HOB</text>
    <rect class="pill-dock-new" x="291" y="141" width="91" height="28" rx="7"/><text x="336" y="159" class="label" font-size="8">Cbike NYC</text>
    <rect class="pill-dock" x="6" y="173" width="91" height="28" rx="7"/><text x="51" y="191" class="label" font-size="8">From JC</text>
    <rect class="pill-dock" x="101" y="173" width="91" height="28" rx="7"/><text x="146" y="191" class="label" font-size="8">To JC</text>
    <rect class="pill-dock" x="196" y="173" width="91" height="28" rx="7"/><text x="241" y="191" class="label" font-size="8">HBLR PATH</text>
    <rect class="pill-dock" x="291" y="173" width="91" height="28" rx="7"/><text x="336" y="191" class="label" font-size="8">Tunnels</text>
    <rect class="pill-dock" x="6" y="205" width="91" height="28" rx="7"/><text x="51" y="223" class="label" font-size="8">MT to JC</text>
    <rect class="pill-dock" x="101" y="205" width="91" height="28" rx="7"/><text x="146" y="223" class="label" font-size="8">NJTb</text>
    <rect class="pill-dock-new" x="196" y="205" width="91" height="28" rx="7"/><text x="241" y="223" class="label" font-size="8">HOB&lt;-&gt;MT</text>

    <text x="12" y="258" class="subtitle">Cbike HOB (6) ù 2-col grid</text>
    <rect fill="#1c2430" stroke="#3d9aad" x="8" y="264" width="180" height="70" rx="4"/>
    <text x="16" y="280" class="label-sm">Madison/10 ù Adams/12</text>
    <text x="16" y="294" class="label-sm">Grand/14 ù Willow/12</text>
    <text x="16" y="308" class="label-sm">14St Ferry ù Sinatra N</text>
    <text x="16" y="324" class="note">own GBFS refresh (HOB set only)</text>

    <text x="200" y="258" class="subtitle">Cbike NYC (5) ù 2-col</text>
    <rect fill="#1c2430" stroke="#3d9aad" x="200" y="264" width="180" height="70" rx="4"/>
    <text x="208" y="280" class="label-sm">12Av/40 ù 11Av/41</text>
    <text x="208" y="294" class="label-sm">44/11 ù 52/11</text>
    <text x="208" y="308" class="label-sm">54/11 ù (blank)</text>
    <text x="208" y="324" class="note">own GBFS refresh (NYC set only)</text>

    <text x="12" y="362" class="subtitle">HOB&lt;-&gt;MT tab sections (scroll)</text>
    <rect fill="#1c2430" stroke="#3d9aad" x="8" y="368" width="372" height="500" rx="4"/>
    <text x="16" y="388" class="label" text-anchor="start" font-size="11">1. NJT bus to NYC</text>
    <text x="16" y="404" class="label-sm">Stop 32084 Willow+15 ∑ routes 126, 119</text>

    <text x="16" y="430" class="label" text-anchor="start" font-size="11">2. PABT arrivals</text>
    <text x="16" y="446" class="label-sm">126 / 119 / 123 + gate numbers</text>

    <text x="16" y="472" class="label" text-anchor="start" font-size="11">3. Subway catchable</text>
    <text x="16" y="488" class="label-sm">offset = 4 + NY-Lincoln (Tunnels tab)</text>
    <text x="16" y="504" class="label-sm">E to Queens ∑ C NB ∑ 7 to Queens (+5)</text>
    <text x="16" y="520" class="label-sm">A NB @ 50 St</text>
    <text x="16" y="536" class="label-sm">6 @ Grand Central (N/S) +8 chained</text>
    <text x="16" y="552" class="label-sm">4/5 NB @ 51 St ∑ SB @ 33 St</text>
    <text x="16" y="568" class="label-sm">null previous ? use current ETAs</text>

    <text x="16" y="594" class="label" text-anchor="start" font-size="11">4. NY Waterway</text>
    <text x="16" y="610" class="label-sm">Hoboken 14th St ? Midtown / W39th</text>
    <text x="16" y="626" class="label-sm">etacloud.connexionz.net/nywaterway/eta/9</text>

    <text x="16" y="652" class="label" text-anchor="start" font-size="11">5. MTA bus catchable (+15)</text>
    <text x="16" y="668" class="label-sm">M42, M50 @ 12 Av/W 42 St (QX6X+XG)</text>

    <text x="16" y="698" class="note">GBFS: JC / S JC / HOB / NYC each refresh own stations</text>
    <text x="16" y="714" class="note">Pill label: HOB&lt;-&gt;MT</text>
    <text x="16" y="738" class="label-sm">Open this SVG in browser/IDE for full view.</text>
  </g>
</svg>
