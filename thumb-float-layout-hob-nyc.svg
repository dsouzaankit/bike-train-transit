<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1020" font-family="system-ui, Segoe UI, sans-serif">
  <style>
    .phone { fill: #0f1419; stroke: #2a3441; stroke-width: 1; }
    .header { fill: #1c2430; }
    .pill { fill: #2a3441; stroke: #3d4f63; stroke-width: 1; }
    .pill-new { fill: #1a3a4a; stroke: #3d9aad; stroke-width: 1.5; }
    .pill-dock { fill: #252b33; stroke: #3d4f63; stroke-width: 1; }
    .pill-dock-new { fill: #1a3a4a; stroke: #3d9aad; stroke-width: 1.5; }
    .toggle { fill: #3d9aad; stroke: #5eb8c9; stroke-width: 1; }
    .label { fill: #ffffff; font-size: 10px; font-weight: 600; text-anchor: middle; }
    .label-sm { fill: #8b98a5; font-size: 9px; }
    .guide { stroke: #003da5; stroke-width: 1; stroke-dasharray: 4 3; fill: none; opacity: 0.7; }
    .title { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .subtitle { fill: #8b98a5; font-size: 10px; }
    .note { fill: #3d9aad; font-size: 9px; }
    .status { fill: #8b98a5; font-size: 11px; text-anchor: middle; }
  </style>

  <text x="20" y="28" class="title">JC/HOB &lt;-&gt; NYC Transit ? thumb float LHD/RHD</text>
  <text x="20" y="46" class="subtitle">Default LHD: primary left of center-line secondary. RHD mirrors. Toggle persists.</text>

  <g transform="translate(20, 60)">
    <text x="195" y="16" class="title" text-anchor="middle" font-size="12">LHD (default)</text>
    <rect class="phone" x="0" y="24" width="390" height="920" rx="12"/>
    <rect class="header" x="0" y="71" width="390" height="64"/>
    <text x="195" y="108" class="label" font-size="12">JC/HOB &lt;-&gt; NYC Transit</text>

    <text x="150" y="150" class="status">Tap a tab to load</text>
    <rect class="toggle" x="318" y="133" width="56" height="28" rx="10"/>
    <text x="346" y="152" class="label" font-size="11">LHD</text>

    <line class="guide" x1="195" y1="175" x2="195" y2="900"/>
    <line class="guide" x1="0" y1="560" x2="390" y2="560"/>
    <text x="8" y="555" class="label-sm">stack center ~65%</text>

    <text x="85" y="240" class="label-sm" text-anchor="middle">primary</text>
    <text x="195" y="304" class="label-sm" text-anchor="middle">secondary</text>

    <rect class="pill" x="35" y="252" width="100" height="50" rx="25"/><text x="85" y="282" class="label">From JC</text>
    <rect class="pill" x="35" y="316" width="100" height="50" rx="25"/><text x="85" y="346" class="label">To JC</text>
    <rect class="pill" x="35" y="380" width="100" height="50" rx="25"/><text x="85" y="410" class="label">HBLR?PATH</text>
    <rect class="pill" x="35" y="444" width="100" height="50" rx="25"/><text x="85" y="474" class="label">Cbike JC</text>
    <rect class="pill" x="35" y="508" width="100" height="50" rx="25"/><text x="85" y="538" class="label">Cbike S JC</text>
    <rect class="pill" x="35" y="572" width="100" height="50" rx="25"/><text x="85" y="602" class="label">Cbike HOB</text>
    <rect class="pill" x="35" y="636" width="100" height="50" rx="25"/><text x="85" y="666" class="label">Cbike NYC</text>

    <rect class="pill" x="145" y="316" width="100" height="50" rx="25"/><text x="195" y="346" class="label">Tunnels</text>
    <rect class="pill" x="145" y="380" width="100" height="50" rx="25"/><text x="195" y="410" class="label">MT?JC</text>
    <rect class="pill" x="145" y="444" width="100" height="50" rx="25"/><text x="195" y="474" class="label">JC NJTb</text>
    <rect class="pill" x="145" y="508" width="100" height="50" rx="25"/><text x="195" y="538" class="label">HOB?MT</text>
    <rect class="pill-new" x="145" y="572" width="100" height="50" rx="25"/><text x="195" y="602" class="label">Whkn</text>
    <rect class="pill-new" x="145" y="636" width="100" height="50" rx="25"/><text x="195" y="666" class="label">PABT</text>

    <text x="195" y="720" class="note" text-anchor="middle">Primary left of center-line secondary</text>
    <text x="195" y="736" class="note" text-anchor="middle">Shorter column bottom-aligned</text>
  </g>

  <g transform="translate(440, 60)">
    <text x="195" y="16" class="title" text-anchor="middle" font-size="12">RHD (mirrored)</text>
    <rect class="phone" x="0" y="24" width="390" height="920" rx="12"/>
    <rect class="header" x="0" y="71" width="390" height="64"/>
    <text x="195" y="108" class="label" font-size="12">JC/HOB &lt;-&gt; NYC Transit</text>

    <text x="150" y="150" class="status">Tap a tab to load</text>
    <rect class="toggle" x="318" y="133" width="56" height="28" rx="10"/>
    <text x="346" y="152" class="label" font-size="11">RHD</text>

    <line class="guide" x1="195" y1="175" x2="195" y2="900"/>

    <text x="195" y="304" class="label-sm" text-anchor="middle">secondary</text>
    <text x="305" y="240" class="label-sm" text-anchor="middle">primary</text>

    <rect class="pill" x="145" y="316" width="100" height="50" rx="25"/><text x="195" y="346" class="label">Tunnels</text>
    <rect class="pill" x="145" y="380" width="100" height="50" rx="25"/><text x="195" y="410" class="label">MT?JC</text>
    <rect class="pill" x="145" y="444" width="100" height="50" rx="25"/><text x="195" y="474" class="label">JC NJTb</text>
    <rect class="pill" x="145" y="508" width="100" height="50" rx="25"/><text x="195" y="538" class="label">HOB?MT</text>
    <rect class="pill-new" x="145" y="572" width="100" height="50" rx="25"/><text x="195" y="602" class="label">Whkn</text>
    <rect class="pill-new" x="145" y="636" width="100" height="50" rx="25"/><text x="195" y="666" class="label">PABT</text>

    <rect class="pill" x="255" y="252" width="100" height="50" rx="25"/><text x="305" y="282" class="label">From JC</text>
    <rect class="pill" x="255" y="316" width="100" height="50" rx="25"/><text x="305" y="346" class="label">To JC</text>
    <rect class="pill" x="255" y="380" width="100" height="50" rx="25"/><text x="305" y="410" class="label">HBLR?PATH</text>
    <rect class="pill" x="255" y="444" width="100" height="50" rx="25"/><text x="305" y="474" class="label">Cbike JC</text>
    <rect class="pill" x="255" y="508" width="100" height="50" rx="25"/><text x="305" y="538" class="label">Cbike S JC</text>
    <rect class="pill" x="255" y="572" width="100" height="50" rx="25"/><text x="305" y="602" class="label">Cbike HOB</text>
    <rect class="pill" x="255" y="636" width="100" height="50" rx="25"/><text x="305" y="666" class="label">Cbike NYC</text>

    <text x="195" y="720" class="note" text-anchor="middle">Primary right of center-line secondary</text>
    <text x="195" y="736" class="note" text-anchor="middle">Same stacks; horizontal mirror only</text>
    <text x="195" y="768" class="label-sm" text-anchor="middle">Persists via lib/ui_prefs.py</text>
  </g>
</svg>
